version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
