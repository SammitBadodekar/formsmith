name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: formsmith
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: formsmith
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U formsmith"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://formsmith:test-only@127.0.0.1:54329/formsmith
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment
      GOOGLE_CLIENT_ID: integration-test
      GOOGLE_CLIENT_SECRET: integration-test
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CONTROL_KEYS: '{"v1":"ci-only-control-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
      ADMISSION_KEYS: '{"v1":"ci-only-admission-key-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm test:intake
      - run: pnpm test:gateway
      - run: docker compose config --quiet
        env:
          FORM_HOST: formsmith.example.org
          ACME_EMAIL: operator@example.org
          POSTGRES_PASSWORD: ci-only
          FORMSMITH_ENV_FILE: .env.example
      - run: docker build --target selfhost --tag formsmith-selfhost:ci .
